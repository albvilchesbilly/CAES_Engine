[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cae-engine"
version = "0.1.0"
description = "Motor de prevalidación de actuaciones CAE (RD 36/2023, Orden TED/815/2023)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "pillow>=10.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools]
packages = ["engine", "generator", "generator.documentos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: tests que necesitan tesseract instalado; se saltan si falta",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "informes", "expedientes", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
