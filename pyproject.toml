[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cae-engine"
version = "0.1.0"
description = "Motor de prevalidación de actuaciones CAE (RD 36/2023, Orden TED/815/2023)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "pillow>=10.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
# `FR-HTTP` (`ADR-015`): la capa que publica `api/` por red. **Nunca en las obligatorias**: el motor, el
# CLI y el banco de pruebas corren sin ellas, y `engine/` no las ve jamas. `pip install -e ".[http]"`.
http = ["starlette>=0.37", "uvicorn>=0.30"]

[tool.setuptools]
packages = [
    "engine",
    "engine.modelo",
    "engine.eventos",
    "salida",
    "salida.constructor",
    "salida.handoff",
    "salida.simulador",
    "salida.transporte",
    "generator",
    "generator.documentos",
    "api",
    "api.comandos",
    "api.http",
    "api.lecturas",
]

[tool.setuptools.package-data]
"engine" = ["*.yaml", "*.json"]
"engine.modelo" = ["esquemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: tests que necesitan tesseract instalado; se saltan si falta",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "informes", "expedientes", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
